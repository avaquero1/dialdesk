[package]
name = "engine"
description = "Fixed math engine: every number comes with a receipt."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
serde.workspace = true
# Exact float parsing: the input hash must match the numbers the caller sent.
serde_json = { workspace = true, features = ["float_roundtrip"] }
schemars.workspace = true
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1"
