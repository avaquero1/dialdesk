[package]
name = "egress-proxy"
description = "The sandboxes' only way out: an allowlisting CONNECT proxy."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "egress_proxy"
path = "src/lib.rs"

[[bin]]
name = "egress-proxy"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
time = { version = "0.3", features = ["formatting"] }
