[package]
name = "sandbox-manager"
description = "Creates, watches and destroys the sandboxes that read pages and run the engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine = { path = "../../engine" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
